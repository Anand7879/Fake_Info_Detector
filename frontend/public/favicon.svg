<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="100%" stop-color="#0b1a3a"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield Backplate -->
  <path d="M256 36 L436 106 C436 106 448 290 256 476 C64 290 76 106 76 106 Z"
        fill="url(#bgGrad)"
        stroke="url(#shieldBorder)"
        stroke-width="18"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Soft Glow Shield -->
  <path d="M256 64 L412 124 C412 124 422 276 256 440 C90 276 100 124 100 124 Z"
        fill="url(#glowGrad)"/>

  <!-- Cyber Scanner Horizontal Grid Lines -->
  <path d="M125 180 L387 180" stroke="#00F0FF" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <path d="M110 240 L402 240" stroke="#00F0FF" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <path d="M130 300 L382 300" stroke="#00F0FF" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 6"/>

  <!-- Forensic AI Radar Scan Eye Ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#00F0FF" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="#3B82F6" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Verification Checkmark (Bold, Ultra-Crisp White with Cyan Glow) -->
  <path d="M188 260 L234 306 L332 196"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Checkmark Cyan Accent Flare -->
  <path d="M188 260 L234 306 L332 196"
        fill="none"
        stroke="#00F0FF"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
