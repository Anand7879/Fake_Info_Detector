version: '3.8'

services:
  # Python + FastAPI ML Forensics Engine
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: fake-info-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SAFE_BROWSING_API_KEY=${SAFE_BROWSING_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - GOOGLE_FACTCHECK_API_KEY=${GOOGLE_FACTCHECK_API_KEY:-}
    volumes:
      - ./ai-engine:/app
      - ai-weights:/app/weights
    networks:
      - fake-info-net

  # Node.js + Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fake-info-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - JWT_SECRET=super_secure_fake_info_detector_jwt_secret_key_2026
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fakeinfodb
      - AI_ENGINE_URL=http://ai-engine:8000
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend:/app
      - backend-uploads:/app/uploads
    depends_on:
      - db
      - ai-engine
    networks:
      - fake-info-net

  # Next.js + Tailwind CSS Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fake-info-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - fake-info-net

  # PostgreSQL Database (can also run locally with SQLite if preferred)
  db:
    image: postgres:15-alpine
    container_name: fake-info-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fakeinfodb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fake-info-net

volumes:
  postgres-data:
  backend-uploads:
  ai-weights:

networks:
  fake-info-net:
    driver: bridge
